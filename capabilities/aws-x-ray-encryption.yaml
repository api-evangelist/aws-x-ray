naftiko: 1.0.0-alpha2
info:
  label: AWS X-Ray API — Encryption
  description: 'AWS X-Ray API — Encryption. 2 operations. Lead operation: AWS X-Ray Get Encryption Configuration. Self-contained
    Naftiko capability covering one Aws X Ray business surface.'
  tags:
  - Aws X Ray
  - Encryption
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_X_RAY_API_KEY: AWS_X_RAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: aws-x-ray-encryption
    baseUri: https://xray.{region}.amazonaws.com
    description: AWS X-Ray API — Encryption business capability. Self-contained, no shared references.
    resources:
    - name: EncryptionConfig
      path: /EncryptionConfig
      operations:
      - name: getencryptionconfig
        method: POST
        description: AWS X-Ray Get Encryption Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: PutEncryptionConfig
      path: /PutEncryptionConfig
      operations:
      - name: putencryptionconfig
        method: POST
        description: AWS X-Ray Update Encryption Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_X_RAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: aws-x-ray-encryption-rest
    port: 8080
    description: REST adapter for AWS X-Ray API — Encryption. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/encryptionconfig
      name: encryptionconfig
      description: REST surface for EncryptionConfig.
      operations:
      - method: POST
        name: getencryptionconfig
        description: AWS X-Ray Get Encryption Configuration
        call: aws-x-ray-encryption.getencryptionconfig
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/putencryptionconfig
      name: putencryptionconfig
      description: REST surface for PutEncryptionConfig.
      operations:
      - method: POST
        name: putencryptionconfig
        description: AWS X-Ray Update Encryption Configuration
        call: aws-x-ray-encryption.putencryptionconfig
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aws-x-ray-encryption-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS X-Ray API — Encryption. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: aws-x-ray-get-encryption
      description: AWS X-Ray Get Encryption Configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: aws-x-ray-encryption.getencryptionconfig
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-x-ray-update-encryption
      description: AWS X-Ray Update Encryption Configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: aws-x-ray-encryption.putencryptionconfig
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
