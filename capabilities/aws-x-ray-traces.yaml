    resources:
    - path: /v1/tracegraph
      name: tracegraph
      description: REST surface for TraceGraph.
      operations:
      - method: POST
        name: batchgettraces
        description: AWS X-Ray Get a List of Traces by ID
        call: aws-x-ray-traces.batchgettraces
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
