naftiko: 1.0.0-alpha2
info:
  label: AWS X-Ray API — Service Graph
  description: 'AWS X-Ray API — Service Graph. 2 operations. Lead operation: AWS X-Ray Get the Service Graph. Self-contained
    Naftiko capability covering one Aws X Ray business surface.'
  tags:
  - Aws X Ray
  - Service Graph
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_X_RAY_API_KEY: AWS_X_RAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: aws-x-ray-service-graph
    baseUri: https://xray.{region}.amazonaws.com
    description: AWS X-Ray API — Service Graph business capability. Self-contained, no shared references.
    resources:
    - name: ServiceGraph
      path: /ServiceGraph
      operations:
      - name: getservicegraph
        method: POST
        description: AWS X-Ray Get the Service Graph
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: TimeSeriesServiceStatistics
      path: /TimeSeriesServiceStatistics
      operations:
      - name: gettimeseriesservicestatistics
        method: POST
        description: AWS X-Ray Get Time Series Service Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_X_RAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: aws-x-ray-service-graph-rest
    port: 8080
    description: REST adapter for AWS X-Ray API — Service Graph. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/servicegraph
      name: servicegraph
      description: REST surface for ServiceGraph.
      operations:
      - method: POST
        name: getservicegraph
        description: AWS X-Ray Get the Service Graph
        call: aws-x-ray-service-graph.getservicegraph
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/timeseriesservicestatistics
      name: timeseriesservicestatistics
      description: REST surface for TimeSeriesServiceStatistics.
      operations:
      - method: POST
        name: gettimeseriesservicestatistics
        description: AWS X-Ray Get Time Series Service Statistics
        call: aws-x-ray-service-graph.gettimeseriesservicestatistics
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aws-x-ray-service-graph-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS X-Ray API — Service Graph. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: aws-x-ray-get-service
      description: AWS X-Ray Get the Service Graph
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: aws-x-ray-service-graph.getservicegraph
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-x-ray-get-time
      description: AWS X-Ray Get Time Series Service Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: aws-x-ray-service-graph.gettimeseriesservicestatistics
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
