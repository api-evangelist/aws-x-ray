naftiko: 1.0.0-alpha2
info:
  label: AWS X-Ray API — Insights
  description: 'AWS X-Ray API — Insights. 2 operations. Lead operation: AWS X-Ray Get Insight Details. Self-contained Naftiko
    capability covering one Aws X Ray business surface.'
  tags:
  - Aws X Ray
  - Insights
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_X_RAY_API_KEY: AWS_X_RAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: aws-x-ray-insights
    baseUri: https://xray.{region}.amazonaws.com
    description: AWS X-Ray API — Insights business capability. Self-contained, no shared references.
    resources:
    - name: Insight
      path: /Insight
      operations:
      - name: getinsight
        method: POST
        description: AWS X-Ray Get Insight Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: Insights
      path: /Insights
      operations:
      - name: getinsightsummaries
        method: POST
        description: AWS X-Ray Get Insight Summaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_X_RAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: aws-x-ray-insights-rest
    port: 8080
    description: REST adapter for AWS X-Ray API — Insights. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/insight
      name: insight
      description: REST surface for Insight.
      operations:
      - method: POST
        name: getinsight
        description: AWS X-Ray Get Insight Details
        call: aws-x-ray-insights.getinsight
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/insights
      name: insights
      description: REST surface for Insights.
      operations:
      - method: POST
        name: getinsightsummaries
        description: AWS X-Ray Get Insight Summaries
        call: aws-x-ray-insights.getinsightsummaries
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aws-x-ray-insights-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS X-Ray API — Insights. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: aws-x-ray-get-insight
      description: AWS X-Ray Get Insight Details
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: aws-x-ray-insights.getinsight
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-x-ray-get-insight-2
      description: AWS X-Ray Get Insight Summaries
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: aws-x-ray-insights.getinsightsummaries
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
