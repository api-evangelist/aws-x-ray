openapi: 3.2.0
info:
  title: AWS X-Ray Encryption Untag Resource API
  description: AWS X-Ray provides APIs for managing trace data, sampling rules, groups, and encryption configuration. X-Ray helps developers analyze and debug distributed applications by collecting trace data as requests travel through application components.
  version: '2016-04-12'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/xray/
servers:
- url: https://xray.{region}.amazonaws.com
  description: AWS X-Ray regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
security:
- aws_sig_v4: []
tags:
- name: UntagResource
paths:
  /UntagResource:
    post:
      operationId: UntagResource
      summary: AWS X-Ray Untag a Resource
      description: Removes tags from an X-Ray resource.
      tags:
      - UntagResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ResourceARN
              - TagKeys
              properties:
                ResourceARN:
                  type: string
                TagKeys:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Successful response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_sig_v4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4
